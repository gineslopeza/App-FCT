[package]
name = "app-fct"
version = "0.1.0"
description = "App FCT: seguimiento de la formación en empresa"
edition = "2021"
authors = ["Ginés López Arribas"]
license-file = "../LICENSE"
publish = false

[lib]
name = "app_fct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
