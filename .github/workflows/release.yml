name: Release

# Publica una versión: compila el instalador de Windows firmado y lo sube a la release, con latest.json
# (las apps instaladas lo ven al abrirse y se actualizan solas).
#
# Tres formas de lanzarla:
# - Crear una release en GitHub (Releases → Draft a new release, etiqueta 0.2.0 o v0.2.0 sobre main → Publish).
# - Actions → Release → Run workflow (versión: patch, minor, major o X.Y.Z). Si la etiqueta ya existe,
#   compila esa; si no, prepara la versión (package.json, Cargo.toml, CHANGELOG) y crea la etiqueta en main.
# - Desde el equipo: pnpm release + git push --follow-tags, y después Run workflow con esa versión.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión: patch, minor, major o X.Y.Z (si ya existe la etiqueta, solo compila)'
        required: true
        default: 'patch'

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comprobar:
    uses: ./.github/workflows/ci.yml

  etiqueta:
    needs: comprobar
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: t
        env:
          EVENTO: ${{ github.event_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENTO" = "release" ]; then
            echo "tag=$TAG_RELEASE" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Run workflow: si la etiqueta ya existe (con o sin «v»), se compila esa
          for t in "$VERSION" "v$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "tag=$t" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "$VERSION"
          git push origin HEAD:main --follow-tags
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: La versión de la app coincide con la etiqueta
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          git checkout -q "$TAG"
          V=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$V" ]; then echo "::error::La etiqueta $TAG no coincide con la versión de package.json ($V). Prepara la versión con Run workflow o con pnpm release."; exit 1; fi

  escritorio:
    needs: etiqueta
    runs-on: windows-latest
    env:
      TAG: ${{ needs.etiqueta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.etiqueta.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Clave pública del actualizador
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then echo "::error::Falta el secreto TAURI_UPDATER_PUBKEY (ver README, «Publicar una versión»)."; exit 1; fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins.updater.pubkey=process.env.PUBKEY.trim();fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Notas de la versión
        shell: bash
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versión $VERSION." > notas.md
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: App FCT ${{ env.TAG }}
          releaseBodyPath: notas.md
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
