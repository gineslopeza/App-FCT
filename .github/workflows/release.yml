name: Release

# Se lanza al subir una etiqueta de versión (pnpm release → git push --follow-tags).
# Compila el instalador de Windows firmado para el actualizador y publica latest.json:
# las apps instaladas lo ven al abrirse y se actualizan solas.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  comprobar:
    uses: ./.github/workflows/ci.yml

  escritorio:
    needs: comprobar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Clave pública del actualizador
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then echo "::error::Falta el secreto TAURI_UPDATER_PUBKEY (ver README, «Publicar una versión»)."; exit 1; fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins.updater.pubkey=process.env.PUBKEY.trim();fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Notas de la versión
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versión $VERSION." > notas.md
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: App FCT ${{ github.ref_name }}
          releaseBodyPath: notas.md
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # Versión web (Edge o Chrome) en GitHub Pages. El Excel se abre desde el propio equipo: no sale del navegador.
  web:
    needs: comprobar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
