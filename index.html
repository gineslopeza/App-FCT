<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1d23" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>App FCT</title>
    <script>
      // Aplica el tema antes de pintar (evita el parpadeo)
      try {
        var p = JSON.parse(localStorage.getItem('app-fct:preferencias') || '{}');
        var t = p.tema || 'sistema';
        if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
